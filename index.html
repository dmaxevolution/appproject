<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>APP PROJECT - V5 Working</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell" id="shell">
  <header class="topbar">
    <div class="brand-row">
      <div class="brand"><div class="logo">⚡</div><div><b>APP PROJECT</b><span>V6 Luxury Border</span></div></div>
      <div class="top-controls">
        <button id="darkBtn" class="icon-btn" onclick="toggleDark()" title="Dark Mode">🌙</button>
        <div class="zoom-wrap"><span>🔍</span><input type="range" id="zoomRange" min="100" max="200" value="100" oninput="setZoom(this.value)"><b id="zoomVal">100%</b></div>
        <button id="globalOnTopBtn" class="btn btn-xs btn-on-top" onclick="toggleGlobalOnTop()">📌 On Top</button>
      </div>
    </div>
    <div class="tabs"><button id="tab1" class="tab active" onclick="switchTab(1)">📦 Project</button><button id="tab2" class="tab" onclick="switchTab(2)">☁️ Backup</button></div>
  </header>
  <div class="stats">
    <div class="chip"><i>📁</i><b id="sActive">-</b><small>Active</small></div>
    <div class="chip"><i>📊</i><b id="sTotalP">0</b><small>Projects</small></div>
    <div class="chip"><i>🧩</i><b id="sTotalI">0</b><small>Items</small></div>
    <div class="chip"><i>🕒</i><b id="sTime">-</b><small>Updated</small></div>
  </div>
  <div id="page1" class="page active">
    <section class="card">
      <div class="card-head">
        <select id="projectSelect" onchange="switchProject()"></select>
        <div class="head-actions">
          <button class="btn btn-primary btn-xs" onclick="createNewProject()">+ Baru</button>
          <button class="btn btn-danger btn-xs" onclick="deleteCurrentProject()">Hapus</button>
        </div>
      </div>
      <input type="text" id="projectName" class="input input-title" placeholder="Nama Project..." oninput="updateProjectName()">
      <div class="divider"></div>
      <div class="card-head">
        <h3>Komponen <small id="compCount">0</small></h3>
        <div class="head-actions">
          <button class="btn btn-primary btn-xs" onclick="addDynamicItem()">+ Komponen</button>
          <button class="btn btn-success btn-xs" id="openAllBtn" onclick="executeAllUrlsDelayed()">📋 Salin Semua URL</button>
          <span class="small muted" id="delayInfo"></span>
        </div>
      </div>
      <div id="dynamicItemsContainer"></div>
    </section>
  </div>
  <div id="page2" class="page">
    <section class="card"><h3>☁️ Cloud Sync</h3><div class="form"><label>GAS Web App URL</label><input type="url" id="cloudUrl" placeholder="https://script.google.com/..." oninput="saveCloudUrlData()"><label style="margin-top:8px">API Key</label><input type="text" id="apiKey" placeholder="optional..." oninput="saveApiKey()"></div><div class="btns"><button class="btn btn-primary" onclick="syncToCloud()">☁️ Backup Cloud</button><button class="btn btn-secondary" onclick="exportJSON()">💾 JSON</button><button class="btn btn-secondary" onclick="exportCSV()">📄 CSV</button><button class="btn btn-success" onclick="exportPNG()">🖼️ PNG</button></div></section>
    <section class="card"><h3>📥 Restore</h3><div class="btns"><label class="btn btn-info btn-sm filebtn">JSON<input type="file" accept=".json" onchange="importJSON(event)"></label><label class="btn btn-info btn-sm filebtn">CSV<input type="file" accept=".csv" onchange="importCSV(event)"></label><label class="btn btn-info btn-sm filebtn">PNG<input type="file" accept=".png" onchange="importPNG(event)"></label></div><div class="divider"></div><div class="small muted">V5 Working - Tombol semua sudah dites fungsi</div><div class="btns" style="margin-top:10px"><button class="btn btn-danger btn-sm" onclick="resetAll()">🗑️ Reset</button><button class="btn btn-secondary btn-sm" onclick="clearCache()">🧹 Clear Cache</button></div></section>
  </div>
  <footer class="foot">V6 Luxury - Border Mewah + Dark + OnTop • Compact 50% • OnTop Header • Move ▲▼ • Delay Open • Dark • Zoom</footer>
</div>
<div id="popupOverlay" class="overlay hidden"><div id="popupBox" class="popup"><div class="popup-head" id="popupDrag"><div class="ph-left"><div class="ph-icon">⧉</div><div><b id="popupTitle">Editor</b><small id="popupSub">drag • Pin Top</small></div></div><div class="ph-right"><button id="onTopBtn" class="btn btn-xs btn-on-top" onclick="toggleOnTop()">📌 Pin</button><button class="btn btn-xs" onclick="closePopup()">✕</button></div></div><div class="popup-meta"><input id="popupLabel" class="input input-xs" style="width:38%" placeholder="Label"><select id="popupType" class="input input-xs" style="flex:1"><option value="url">URL</option><option value="folder">Folder</option><option value="text">Teks</option><option value="code">Code</option><option value="json">JSON</option><option value="note">Note</option></select><span id="popupChar" class="muted small">0</span></div><textarea id="popupValue" class="popup-textarea" placeholder="Paste kode panjang..."></textarea><div class="popup-foot"><div class="left"><button class="btn btn-xs btn-secondary" onclick="closePopup()">Tutup</button><button class="btn btn-xs btn-black" onclick="copyPopup()">Copy All</button></div><div class="right"><button class="btn btn-xs btn-primary" onclick="savePopup()">Simpan</button></div></div></div></div>
<button id="fabOnTop" class="fab hidden" onclick="toggleOnTop()">📌 On Top</button>
<script src="app.js"></script>
</body>
</html>
